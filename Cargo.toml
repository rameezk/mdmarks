[package]
name = "mdmarks"
version = "0.1.0"
edition = "2021"
description = "A markdown-driven bookmark manager"
license = "MIT"

[[bin]]
name = "mdmarks"
path = "src/main.rs"

[lib]
name = "mdmarks"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
url = "2.5"
ureq = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
tiny_http = "0.12"
